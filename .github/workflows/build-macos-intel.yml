name: Build Saeron portable macOS Intel

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    # macos-13 was retired from the hosted runner pool. macos-15-intel
    # keeps this build on an x86_64 runner instead of cross-compiling it.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build portable app
        shell: bash
        run: bash packaging/build_portable_macos.sh
      - name: Upload portable app
        uses: actions/upload-artifact@v5
        with:
          name: Saeron_Portable_macOS_Intel
          path: portable/Saeron_Portable_macOS_Intel.zip
