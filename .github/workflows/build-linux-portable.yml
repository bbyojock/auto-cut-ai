name: Build Saeron portable Linux app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build portable app
        shell: bash
        run: bash packaging/build_portable_linux.sh
      - name: Upload portable app
        uses: actions/upload-artifact@v5
        with:
          name: Saeron_Portable_Linux_x64
          path: portable/Saeron_Portable_Linux_x64.tar.gz
